name: 毎朝の天気をLINEに送る
# テスト送信かどうかが実行一覧で分かるようにする（二重送信の判定にも使う）
run-name: ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && '【テスト】天気をLINEに送る' || '毎朝の天気をLINEに送る' }}

on:
  # 手動実行（Actions 画面の「Run workflow」や gh workflow run）
  workflow_dispatch:
    inputs:
      test:
        description: テスト送信にする（「【テスト送信】」付きで、二重送信の判定もしない）
        type: boolean
        default: true # Actions 画面の「Run workflow」から押したときはテスト送信
  # GitHub の定時実行は毎朝3〜4時間遅れて起動している（11/15・11/16 実績）。
  # そのため深夜〜早朝に何度か起動を予約し、7:00 より前に起動した回は 7:00 まで待ってから送る。
  # 最初に送った1回以外は「送信済み」を見て止まる。（時刻は UTC。JST 2:10・3:10・4:10・5:10・6:40）
  schedule:
    - cron: '10 17 * * *'
    - cron: '10 18 * * *'
    - cron: '10 19 * * *'
    - cron: '10 20 * * *'
    - cron: '40 21 * * *'

permissions:
  contents: read
  actions: read # 今日すでに送ったかを実行履歴で確認するため

# 複数の起動が重なっても同時には走らせない（後の方が「送信済み」を見て止まる）
concurrency:
  group: morning-line
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 7:00 までの待ち（最大約5時間）＋天気データの取り直し（最大10分）
    env:
      IS_TEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && '1' || '' }}
    steps:
      - name: 7:00（日本時間）まで待つ
        if: env.IS_TEST != '1'
        run: |
          now=$(date +%s)
          target=$(date -d "$(TZ=Asia/Tokyo date +%F) 07:00 +0900" +%s)
          if [ "$now" -lt "$target" ]; then
            wait=$((target - now))
            echo "7:00 まで $((wait / 60)) 分待ちます"
            sleep "$wait"
          else
            echo "7:00 を過ぎているので待たずに進みます"
          fi
      - name: 今日すでに送ったか確認
        id: check
        if: env.IS_TEST != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d "$(TZ=Asia/Tokyo date +%F) 00:00 +0900" +%Y-%m-%dT%H:%M:%SZ)
          sent=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/morning-line.yml/runs?status=success&created=>=$since&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .display_title == \"毎朝の天気をLINEに送る\")] | length")
          echo "今日（JST）の送信済み: ${sent}件"
          if [ "$sent" -gt 0 ]; then
            echo "sent=true" >> "$GITHUB_OUTPUT"
            echo "::notice::今日はすでに送信済みのため、送信しません"
          fi
      - uses: actions/checkout@v7
        if: steps.check.outputs.sent != 'true'
      - uses: actions/setup-node@v7
        if: steps.check.outputs.sent != 'true'
        with:
          node-version: 24
      - name: 天気サマリを送信
        if: steps.check.outputs.sent != 'true'
        run: node scripts/morning-line.mjs
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          WARD: 目黒区
          TEST: ${{ env.IS_TEST }}
          # 本番は天気データが取れなければ最大10分取り直す（テストはすぐ結果が分かるよう1分）
          RETRY_MINUTES: ${{ env.IS_TEST == '1' && '1' || '10' }}
