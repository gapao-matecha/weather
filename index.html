<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="東京23区の今日と1週間の天気。気温・体感温度・降水量のグラフと、傘や服装のアドバイス。">
<meta name="theme-color" content="#EEF3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>東京都の天気</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #eef3f8;
    --card: #ffffff;
    --text: #1d2733;
    --muted: #6b7785;
    --line: #e2e8ef;
    --accent: #2f7de1;
    --warm: #e8603c;
    --cool: #3b82f6;
    --rain: #4aa3df;
    --app: #8b5cf6;
    /* 波予報（なみよみ由来）：スコア色・風の向き・潮位 */
    --r0: #b7c2c5; --r1: #e3a857; --r2: #e7cf4e; --r3: #6cc07a; --r4: #1fa37c; --r5: #0d7a8e;
    --off: #1fa37c; --on: #d2553d; --cross: #c9933e; --sand: #c9853e;
    --good: #2e9e6a;
    --warn: #e09a1a;
    --bad: #d6453d;
    --shadow: 0 2px 12px rgba(20, 40, 70, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f151c;
      --card: #18212b;
      --text: #e6edf3;
      --muted: #8d99a6;
      --line: #263240;
      --accent: #5b9cf0;
      --r0: #3d5157;
      --shadow: 0 2px 12px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  header { margin-bottom: 16px; }
  .head-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; }
  /* 天気｜波 の切り替え、波のポイント選択（同じセグメント型） */
  .seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--card); border-radius: 999px; box-shadow: var(--shadow); }
  .seg button {
    font: inherit; font-weight: 700; font-size: .95rem; color: var(--muted); background: transparent;
    border: none; border-radius: 999px; padding: 7px 18px; cursor: pointer; transition: background-color .15s, color .15s;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-selected="true"] { background: var(--accent); color: #fff; }
  .seg button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
  .seg.spots button { display: flex; flex-direction: column; align-items: center; line-height: 1.15; padding: 6px 16px; }
  .seg.spots button small { font-size: .65rem; font-weight: 500; opacity: .85; }
  header h1 { font-size: 1.4rem; margin: 0; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .ward-picker { position: relative; display: inline-flex; }
  .ward-picker select {
    appearance: none; -webkit-appearance: none;
    font: inherit; font-weight: 700; line-height: 1.3; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, var(--card));
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 999px; padding: 5px 36px 5px 16px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(20, 40, 70, .06);
    transition: background-color .15s, border-color .15s, box-shadow .15s;
  }
  .ward-picker select:hover {
    background: color-mix(in srgb, var(--accent) 16%, var(--card));
    border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .ward-picker select:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .ward-picker select option { color: var(--text); background: var(--card); font-weight: 500; }
  .ward-picker::after {
    content: ""; position: absolute; right: 15px; top: 50%; width: 7px; height: 7px;
    border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }
  header .updated { color: var(--muted); font-size: .85rem; }
  .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 1rem; margin: 0 0 14px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }

  /* hero */
  .hero { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
  .hero .icon svg { width: 120px; height: 120px; }
  .hero .now-temp { font-size: 3.4rem; font-weight: 700; line-height: 1; }
  .hero .now-temp small { font-size: 1.2rem; color: var(--muted); font-weight: 500; }
  .hero .desc { font-size: 1.15rem; margin-top: 4px; }
  .hero .hilo { margin-top: 6px; font-size: 1rem; }
  .hero .hilo .hi { color: var(--warm); font-weight: 700; }
  .hero .hilo .lo { color: var(--cool); font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 18px; }
  .stat { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .stat .k { font-size: .75rem; color: var(--muted); }
  .stat .v { font-size: 1.1rem; font-weight: 700; }

  /* summary */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .tip { border-radius: 14px; padding: 14px 16px; border: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
  .tip .emoji { font-size: 1.9rem; line-height: 1; }
  .tip .t { font-weight: 700; font-size: 1.05rem; }
  .tip .d { color: var(--muted); font-size: .88rem; margin-top: 2px; }
  .tip.good { border-left: 5px solid var(--good); }
  .tip.warn { border-left: 5px solid var(--warn); }
  .tip.bad  { border-left: 5px solid var(--bad); }
  .tip.info { border-left: 5px solid var(--accent); }
  .headline { font-size: 1.15rem; font-weight: 700; margin: 0 0 14px; }

  /* hourly strip */
  .hours { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
  .hour { flex: 0 0 64px; text-align: center; padding: 8px 4px; border-radius: 12px; scroll-snap-align: start; }
  .hour.now { background: var(--bg); outline: 2px solid var(--accent); outline-offset: -2px; }
  .hour.past { opacity: .45; }
  .hour .h { font-size: .8rem; color: var(--muted); }
  .hour svg { width: 40px; height: 40px; }
  .hour .tp { font-weight: 700; }
  .hour .pp { font-size: .75rem; color: var(--rain); }
  .chart-box { position: relative; height: 260px; margin-top: 12px; }
  .chart-box.hourly { height: 220px; } /* 気温・雨は同じ高さにして目盛り線の間隔を揃える */
  .chart-title { font-size: .9rem; font-weight: 700; margin: 18px 0 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: .85rem; }
  .legend .ln { display: inline-block; width: 26px; height: 0; vertical-align: middle; margin-right: 6px; }
  .legend .ln.temp { border-top: 4px solid var(--warm); }
  .legend .ln.app { border-top: 3px dashed var(--app); }
  .legend .ln.bar { height: 10px; border-radius: 2px; background: var(--rain); opacity: .7; }
  .legend .ln.prob { border-top: 2px solid var(--rain); }
  .legend .note { color: var(--muted); font-size: .78rem; }

  /* weekly */
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .day { text-align: center; padding: 10px 4px; border-radius: 12px; background: var(--bg); }
  .day.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .day .dn { font-weight: 700; font-size: .9rem; }
  .day .dn.sat { color: var(--cool); }
  .day .dn.sun { color: var(--bad); }
  .day .dd { font-size: .75rem; color: var(--muted); }
  .day svg { width: 48px; height: 48px; margin: 4px 0; }
  .day .dw { font-size: .75rem; min-height: 2.2em; }
  .day .hl { font-size: .95rem; }
  .day .hl .hi { color: var(--warm); font-weight: 700; }
  .day .hl .lo { color: var(--cool); font-weight: 700; }
  .day .pr { font-size: .75rem; color: var(--rain); margin-top: 2px; }
  .umb { font-size: .9rem; }
  .day[role="button"] { cursor: pointer; transition: transform .12s, box-shadow .12s, background-color .12s; }
  .day[role="button"]:hover { background: color-mix(in srgb, var(--accent) 8%, var(--bg)); box-shadow: 0 2px 8px rgba(20, 40, 70, .08); }
  .day[role="button"]:active { transform: scale(.97); }
  .day[role="button"]:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -3px; }
  .days-hint { color: var(--muted); font-size: .78rem; margin: -6px 0 10px; }

  /* 日別の詳細モーダル（スマホは下から出るシート、PCは中央のダイアログ） */
  html:has(dialog[open]) { overflow: hidden; }
  #dayModal {
    width: min(860px, calc(100% - 32px)); max-width: none; max-height: calc(100dvh - 48px);
    padding: 0; border: none; border-radius: 20px;
    background: var(--card); color: var(--text);
    box-shadow: 0 24px 64px rgba(10, 20, 35, .28);
  }
  #dayModal[open] { display: flex; flex-direction: column; animation: dm-pop .18s ease-out; }
  #dayModal::backdrop { background: rgba(10, 20, 30, .45); backdrop-filter: blur(2px); }
  .dm-head {
    display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 8px;
    padding: 14px 14px 12px; border-bottom: 1px solid var(--line);
  }
  .dm-titles { text-align: center; min-width: 0; }
  .dm-titles h2 { margin: 0; font-size: 1.05rem; color: var(--text); }
  .dm-sub { font-size: .82rem; color: var(--muted); }
  .dm-sub .hi { color: var(--warm); font-weight: 700; }
  .dm-sub .lo { color: var(--cool); font-weight: 700; }
  .dm-btn {
    width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 1.25rem; line-height: 1;
    display: grid; place-items: center; cursor: pointer; transition: background-color .12s;
  }
  .dm-btn:hover:not(:disabled) { background: var(--bg); }
  .dm-btn:disabled { opacity: .3; cursor: default; }
  .dm-btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .dm-close { margin-left: 4px; }
  #dayModal { overflow: hidden; }
  #dmBody { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 24px; overscroll-behavior: contain; }
  .dm-summary { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .dm-summary svg { width: 64px; height: 64px; flex: none; }
  .dm-summary .t { font-weight: 700; font-size: 1.05rem; }
  .dm-summary .d { color: var(--muted); font-size: .88rem; }
  #dmBody .stats { margin: 0 0 16px; }
  @keyframes dm-pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  @keyframes dm-sheet { from { transform: translateY(100%); } }

  @media (max-width: 720px) {
    #dayModal {
      width: 100%; max-height: 88dvh; margin: auto 0 0;
      border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom);
    }
    #dayModal[open] { animation: dm-sheet .24s cubic-bezier(.2, .8, .2, 1); }
    .dm-head { position: relative; padding-top: 22px; }
    .dm-head::before {
      content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 4px;
      margin-left: -20px; border-radius: 2px; background: var(--line);
    }
    #dmBody { padding: 14px 16px 20px; }
  }
  @media (prefers-reduced-motion: reduce) { #dayModal[open] { animation: none; } }

  .loading, .error { text-align: center; padding: 60px 0; color: var(--muted); }
  .error { color: var(--bad); }
  footer { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 8px; }
  footer a { color: inherit; }

  @media (max-width: 720px) {
    .days { grid-template-columns: repeat(7, minmax(78px, 1fr)); overflow-x: auto; }
    .hero { grid-template-columns: 1fr; text-align: center; justify-items: center; }
    .hero .icon svg { width: 100px; height: 100px; }
  }

  /* ---------- 波予報 ---------- */
  .s-hero { display: grid; grid-template-columns: 280px 1fr; gap: 16px; margin-bottom: 16px; }
  .s-hero .card { margin-bottom: 0; }
  .s-score { position: relative; overflow: hidden; color: #fff; display: flex; flex-direction: column; justify-content: space-between; min-height: 230px; }
  .s-score .when { font-size: .82rem; opacity: .9; }
  .s-score .spot { font-size: 1.25rem; font-weight: 700; margin-top: 2px; }
  .s-score .big { font-size: 3.6rem; font-weight: 700; line-height: 1; margin-top: 16px; font-variant-numeric: tabular-nums; }
  .s-score .big small { font-size: 1.05rem; margin-left: 4px; }
  .s-score .label { font-size: 1.3rem; font-weight: 700; margin-top: 6px; }
  .s-score .size { font-size: .88rem; margin-top: 4px; opacity: .95; }
  .s-score svg.wave-deco { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 56px; opacity: .22; }
  .s-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 18px; align-content: center; }
  .s-stat .k { font-size: .75rem; color: var(--muted); }
  .s-stat .v { font-size: 1.45rem; font-weight: 700; margin-top: 2px; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .s-stat .v small { font-size: .8rem; font-weight: 500; color: var(--muted); }
  .s-stat .s { font-size: .75rem; color: var(--muted); margin-top: 2px; }
  .s-tag { display: inline-block; font-size: .68rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; color: #fff; vertical-align: middle; }
  .s-tag.off { background: var(--off); } .s-tag.on { background: var(--on); } .s-tag.cross { background: var(--cross); }
  .s-arrow { display: inline-block; width: 22px; height: 22px; flex: none; }
  .card h2 small { font-weight: 400; font-size: .78rem; margin-left: 6px; }
  .s-days { display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 4px; }
  .s-day { background: var(--bg); border-radius: 12px; padding: 12px; cursor: pointer; scroll-snap-align: start; transition: background-color .12s, transform .12s; }
  .s-day:hover { background: color-mix(in srgb, var(--accent) 8%, var(--bg)); }
  .s-day:active { transform: scale(.97); }
  .s-day.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  .s-day:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -3px; }
  .s-day .d { font-weight: 700; font-size: .95rem; }
  .s-day .d small { font-weight: 500; color: var(--muted); font-size: .75rem; margin-left: 4px; }
  .s-day .bar { height: 6px; border-radius: 4px; margin: 10px 0; }
  .s-day .sz { font-weight: 700; font-size: 1.05rem; }
  .s-day .meta { font-size: .75rem; color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .s-chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: .85rem; }
  .s-readout { font-weight: 700; min-height: 1.4em; }
  .s-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: .78rem; }
  .s-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .s-scroller { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
  #sChart { display: block; touch-action: pan-x; }
  #sChart text { fill: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  #sChart .daylbl { fill: var(--text); font-weight: 700; font-size: 12px; }
  footer .surf-note { display: block; max-width: 720px; margin: 0 auto 6px; line-height: 1.7; }
  @media (max-width: 760px) {
    .s-hero { grid-template-columns: 1fr; }
    .s-score { display: grid; grid-template-columns: 1fr auto; align-items: end; min-height: 0; padding: 16px 18px; }
    .s-score .big { font-size: 2.8rem; margin-top: 0; text-align: right; }
    .s-score .label { font-size: 1.1rem; text-align: right; }
    .s-score .size { text-align: right; }
    .s-stats { grid-template-columns: repeat(2, 1fr); gap: 14px 12px; }
    .s-stat .v { font-size: 1.25rem; }
    .s-days { grid-template-columns: repeat(7, 124px); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seg" id="viewTabs" role="tablist" aria-label="表示の切り替え">
      <button role="tab" data-view="weather" aria-selected="true">☀️ 天気</button>
      <button role="tab" data-view="surf" aria-selected="false">🌊 波</button>
    </div>
    <div class="head-row" id="weatherHead">
      <h1>📍 東京都 <span class="ward-picker"><select id="ward" aria-label="地域を選択"></select></span> の天気</h1>
      <span class="updated" id="updated"></span>
    </div>
    <div class="head-row" id="surfHead" hidden>
      <h1>🌊 波予報</h1>
      <div class="seg spots" id="spotTabs" role="tablist" aria-label="ポイントを選択"></div>
    </div>
  </header>
  <div id="app"><div class="card loading">天気データを読み込み中…</div></div>
  <div id="surf" hidden><div class="card loading">波予報を読み込み中…</div></div>
  <dialog id="dayModal" aria-labelledby="dmTitle">
    <div class="dm-head">
      <button class="dm-btn" id="dmPrev" type="button" aria-label="前の日">‹</button>
      <div class="dm-titles"><h2 id="dmTitle"></h2><div class="dm-sub" id="dmSub"></div></div>
      <button class="dm-btn" id="dmNext" type="button" aria-label="次の日">›</button>
      <button class="dm-btn dm-close" id="dmClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div id="dmBody"></div>
  </dialog>
  <footer>
    <span class="surf-note" id="surfNote" hidden>波高は有義波高を元にした目安で、サイズ表記（ひざ〜ダブル）は概算です。潮位は数値モデルのため実際の潮見表とずれる場合があります。入水判断は必ず現地の状況を確認してください。</span>
    データ提供: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>（Forecast / Marine API・約10分ごとに自動更新）
  </footer>
</div>

<script>
/* ---------- 地域（東京23区・各区役所付近の座標） ---------- */
const WARDS = [
  ['千代田区', 35.6940, 139.7536], ['中央区', 35.6706, 139.7720], ['港区', 35.6581, 139.7516],
  ['新宿区', 35.6938, 139.7036], ['文京区', 35.7080, 139.7521], ['台東区', 35.7126, 139.7800],
  ['墨田区', 35.7107, 139.8015], ['江東区', 35.6730, 139.8171], ['品川区', 35.6092, 139.7302],
  ['目黒区', 35.6414, 139.6982], ['大田区', 35.5613, 139.7160], ['世田谷区', 35.6464, 139.6533],
  ['渋谷区', 35.6639, 139.6978], ['中野区', 35.7074, 139.6638], ['杉並区', 35.6995, 139.6364],
  ['豊島区', 35.7263, 139.7166], ['北区', 35.7528, 139.7337], ['荒川区', 35.7362, 139.7834],
  ['板橋区', 35.7512, 139.7094], ['練馬区', 35.7356, 139.6517], ['足立区', 35.7750, 139.8044],
  ['葛飾区', 35.7434, 139.8471], ['江戸川区', 35.7067, 139.8683]
].map(([name, lat, lon]) => ({ name, lat, lon }));
const DEFAULT_WARD = '目黒区';

// URL(?ward=渋谷区) → 前回の選択 → 目黒区 の順で決める
function initialWard() {
  const fromUrl = new URLSearchParams(location.search).get('ward');
  let saved = null;
  try { saved = localStorage.getItem('ward'); } catch (e) {}
  return [fromUrl, saved].find(n => WARDS.some(w => w.name === n)) || DEFAULT_WARD;
}
let ward = WARDS.find(w => w.name === initialWard());

function setupWardSelect() {
  const sel = document.getElementById('ward');
  sel.innerHTML = WARDS.map(w => `<option ${w === ward ? 'selected' : ''}>${w.name}</option>`).join('');
  sel.addEventListener('change', () => {
    ward = WARDS.find(w => w.name === sel.value);
    try { localStorage.setItem('ward', ward.name); } catch (e) {}
    const u = new URL(location.href);
    u.searchParams.set('ward', ward.name);
    u.searchParams.delete('day');
    try { history.replaceState(null, '', u); } catch (e) {}
    document.getElementById('app').innerHTML = `<div class="card loading">${ward.name}の天気を読み込み中…</div>`;
    refresh();
  });
}

/* ---------- 天気コード ---------- */
const WMO = {
  0: ['快晴', 'clear'], 1: ['晴れ', 'clear'], 2: ['晴れ時々くもり', 'partly'], 3: ['くもり', 'cloudy'],
  45: ['霧', 'fog'], 48: ['霧', 'fog'],
  51: ['霧雨', 'drizzle'], 53: ['霧雨', 'drizzle'], 55: ['霧雨', 'drizzle'], 56: ['着氷性の霧雨', 'drizzle'], 57: ['着氷性の霧雨', 'drizzle'],
  61: ['小雨', 'rain'], 63: ['雨', 'rain'], 65: ['強い雨', 'heavyrain'], 66: ['着氷性の雨', 'rain'], 67: ['着氷性の雨', 'heavyrain'],
  71: ['小雪', 'snow'], 73: ['雪', 'snow'], 75: ['大雪', 'snow'], 77: ['霧雪', 'snow'],
  80: ['にわか雨', 'showers'], 81: ['にわか雨', 'showers'], 82: ['激しいにわか雨', 'heavyrain'],
  85: ['にわか雪', 'snow'], 86: ['激しいにわか雪', 'snow'],
  95: ['雷雨', 'thunder'], 96: ['雷雨（ひょう）', 'thunder'], 99: ['激しい雷雨', 'thunder']
};
const wDesc = c => (WMO[c] || ['不明'])[0];
const wKind = c => (WMO[c] || [, 'cloudy'])[1];

/* ---------- イラスト(SVG) ---------- */
const SUN = (x = 32, y = 32, r = 11) => {
  let rays = '';
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    rays += `<line x1="${x + Math.cos(a) * (r + 4)}" y1="${y + Math.sin(a) * (r + 4)}" x2="${x + Math.cos(a) * (r + 9)}" y2="${y + Math.sin(a) * (r + 9)}" stroke="#f7b500" stroke-width="3.5" stroke-linecap="round"/>`;
  }
  return `<g>${rays}<circle cx="${x}" cy="${y}" r="${r}" fill="#ffc83d" stroke="#f7a400" stroke-width="2"/></g>`;
};
const MOON = (x = 32, y = 30) =>
  `<path d="M${x + 6} ${y - 14} a14 14 0 1 0 10 22 a11 11 0 1 1 -10 -22z" fill="#ffe27a" stroke="#e5be3c" stroke-width="2"/>`;
const CLOUD = (dx = 0, dy = 0, fill = '#dfe6ee', stroke = '#9aa8b8') =>
  `<path transform="translate(${dx} ${dy})" d="M18 46 h28 a10 10 0 0 0 0-20 a14 14 0 0 0-26-4 a10 10 0 0 0-2 24z" fill="${fill}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>`;
const DROPS = (n = 3, color = '#3d9be0') => {
  const xs = n === 2 ? [26, 38] : n === 4 ? [20, 29, 38, 47] : [22, 32, 42];
  return xs.map((x, i) => `<line x1="${x}" y1="${51 + (i % 2) * 3}" x2="${x - 3}" y2="${58 + (i % 2) * 3}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`).join('');
};
function icon(code, isDay = true) {
  const k = wKind(code);
  const sky = isDay ? SUN : MOON;
  let s;
  switch (k) {
    case 'clear':   s = isDay ? SUN(32, 32, 13) : MOON(30, 32); break;
    case 'partly':  s = (isDay ? SUN(24, 22, 9) : MOON(22, 20)) + CLOUD(4, 4); break;
    case 'cloudy':  s = CLOUD(-8, -6, '#c9d3de', '#8392a3') + CLOUD(4, 2); break;
    case 'fog':     s = CLOUD(0, -6) + [46, 52, 58].map(y => `<line x1="14" y1="${y}" x2="50" y2="${y}" stroke="#9aa8b8" stroke-width="3" stroke-linecap="round"/>`).join(''); break;
    case 'drizzle': s = CLOUD(0, -6) + DROPS(2, '#6fb6e8'); break;
    case 'rain':    s = CLOUD(0, -6, '#c3ccd7', '#7d8b9c') + DROPS(3); break;
    case 'heavyrain': s = CLOUD(0, -6, '#9ba8b7', '#5f6d7d') + DROPS(4, '#1f7fd1'); break;
    case 'showers': s = (isDay ? SUN(22, 18, 8) : MOON(20, 16)) + CLOUD(2, -4) + DROPS(2); break;
    case 'snow':    s = CLOUD(0, -6) + [[22, 54], [32, 58], [42, 54]].map(([x, y]) => `<text x="${x}" y="${y + 4}" font-size="11" text-anchor="middle" fill="#7cc4f2">❄</text>`).join(''); break;
    case 'thunder': s = CLOUD(0, -6, '#8e9aa9', '#56616f') + `<path d="M34 42 l-7 11 h6 l-4 10 l11-14 h-6 l4-7z" fill="#ffcc1a" stroke="#e0a800" stroke-width="1.5" stroke-linejoin="round"/>`; break;
    default:        s = CLOUD();
  }
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${wDesc(code)}">${s}</svg>`;
}

/* ---------- ユーティリティ ---------- */
const DOW = ['日', '月', '火', '水', '木', '金', '土'];
const r1 = v => Math.round(v * 10) / 10;
const r0 = v => Math.round(v);
const pad = n => String(n).padStart(2, '0');
function todayStr() {
  const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ---------- サマリ生成 ---------- */
function feel(max, min, appMax) {
  const t = (max * 2 + min) / 3;
  if (t <= 5)  return { emoji: '🥶', t: 'とても寒い', d: 'ダウンやマフラー、手袋で防寒をしっかり。', cls: 'bad' };
  if (t <= 11) return { emoji: '🧥', t: '寒い', d: 'コートやセーターなど冬物がおすすめ。', cls: 'warn' };
  if (t <= 16) return { emoji: '🧣', t: '肌寒い', d: '薄手のコートやジャケットを羽織って。', cls: 'info' };
  if (t <= 21) return { emoji: '👕', t: '過ごしやすい', d: '長袖シャツやカーディガンでちょうど良さそう。', cls: 'good' };
  if (t <= 26) return { emoji: '🌤️', t: '暖かい', d: '半袖〜薄手の長袖で快適。', cls: 'good' };
  if (t <= 31) return { emoji: '🥵', t: '暑い', d: '半袖で。こまめな水分補給を。', cls: 'warn' };
  return { emoji: '🔥', t: '猛暑', d: '熱中症に厳重警戒。外出は涼しい時間帯に。', cls: 'bad' };
}

function umbrella(hours) {
  // 外出しそうな 7〜22 時を対象
  const active = hours.filter(h => h.hour >= 7 && h.hour <= 22);
  const maxProb = Math.max(...active.map(h => h.prob ?? 0));
  const sum = active.reduce((a, h) => a + (h.precip || 0), 0);
  const rainy = active.filter(h => (h.prob ?? 0) >= 50 || h.precip >= 0.5);
  const span = rainy.length ? `${rainy[0].hour}時〜${rainy[rainy.length - 1].hour + 1}時ごろ` : '';
  if (maxProb >= 60 || sum >= 2)
    return { emoji: '☂️', t: '傘を持って出かけよう', d: `降水確率 最大${maxProb}%・日中の降水量 ${r1(sum)}mm。${span ? span + 'に雨の予想。' : ''}`, cls: 'bad', need: 2 };
  if (maxProb >= 30 || sum >= 0.3)
    return { emoji: '🌂', t: '折りたたみ傘があると安心', d: `降水確率 最大${maxProb}%。${span ? span + 'に降るかも。' : 'にわか雨の可能性あり。'}`, cls: 'warn', need: 1 };
  return { emoji: '😎', t: '傘はいらなそう', d: `日中の降水確率は最大${maxProb}%。`, cls: 'good', need: 0 };
}

function buildTips(today, yest, hours, current) {
  const tips = [];
  const f = feel(today.max, today.min, today.appMax);
  tips.push(f);
  const u = umbrella(hours);
  tips.push(u);

  if (yest) {
    const diff = r1(today.max - yest.max);
    if (Math.abs(diff) >= 1) {
      tips.push({
        emoji: diff > 0 ? '📈' : '📉',
        t: `昨日より${Math.abs(diff)}℃${diff > 0 ? '高い' : '低い'}`,
        d: `昨日の最高 ${r0(yest.max)}℃ → 今日 ${r0(today.max)}℃。${diff <= -3 ? '体感でもはっきり寒く感じそう。' : diff >= 3 ? '昨日より薄着でもOK。' : ''}`,
        cls: 'info'
      });
    } else {
      tips.push({ emoji: '➖', t: '昨日とほぼ同じ気温', d: `昨日の最高 ${r0(yest.max)}℃ / 今日 ${r0(today.max)}℃。`, cls: 'info' });
    }
  }
  const range = today.max - today.min;
  if (range >= 9) {
    tips.push({ emoji: '🌡️', t: `寒暖差 ${r0(range)}℃ に注意`, d: '朝晩は冷えます。脱ぎ着しやすい服装で。', cls: 'warn' });
  }
  if (today.uv >= 6) {
    tips.push({ emoji: '🧴', t: `紫外線が強い（UV ${r1(today.uv)}）`, d: '日焼け止め・帽子・サングラスを。', cls: 'warn' });
  } else if (today.uv >= 3) {
    tips.push({ emoji: '🧢', t: `紫外線はほどほど（UV ${r1(today.uv)}）`, d: '長時間の外出なら日焼け止めを。', cls: 'info' });
  }
  if (today.wind >= 30) {
    tips.push({ emoji: '💨', t: '風が強い', d: `最大風速 ${r0(today.wind / 3.6)}m/s。傘が煽られるかも。`, cls: 'warn' });
  }
  const headline = `今日は${f.t}一日。${u.need === 2 ? '傘を忘れずに！' : u.need === 1 ? '念のため折りたたみ傘を。' : '傘は不要です。'}`;
  return { tips, headline };
}

/* ---------- 1時間ごとの天気（今日・モーダル共通） ---------- */
function hoursOf(H, dateStr) {
  const hours = [];
  H.time.forEach((t, i) => {
    if (t.startsWith(dateStr)) hours.push({
      hour: +t.slice(11, 13), temp: H.temperature_2m[i], app: H.apparent_temperature[i],
      precip: H.precipitation[i], prob: H.precipitation_probability[i], code: H.weather_code[i], isDay: !!H.is_day[i]
    });
  });
  return hours;
}

// nowHour が null の日（明日以降）は「今」の強調をしない
function hourlyHTML(hours, nowHour, key) {
  return `
      <div class="hours" id="${key}Hours">
        ${hours.map(h => `
          <div class="hour ${nowHour == null ? '' : h.hour === nowHour ? 'now' : h.hour < nowHour ? 'past' : ''}" data-hour="${h.hour}">
            <div class="h">${h.hour === nowHour ? '今' : h.hour + '時'}</div>
            ${icon(h.code, h.isDay)}
            <div class="tp">${r0(h.temp)}°</div>
            <div class="pp">💧${h.prob ?? 0}%</div>
          </div>`).join('')}
      </div>
      <div class="chart-title">🌡️ 気温と体感温度</div>
      <div class="legend">
        <span><i class="ln temp"></i>気温</span>
        <span><i class="ln app"></i>体感温度</span>
        <span class="note">体感温度＝風や湿度を考慮した、肌で感じる温度</span>
      </div>
      <div class="chart-box hourly"><canvas id="${key}Temp"></canvas></div>
      <div class="chart-title">☔ 雨</div>
      <div class="legend">
        <span><i class="ln bar"></i>降水量 (mm)</span>
        <span><i class="ln prob"></i>降水確率 (%)</span>
      </div>
      <div class="chart-box hourly"><canvas id="${key}Rain"></canvas></div>`;
}

function scrollStripTo(key, hour) {
  const strip = document.getElementById(key + 'Hours');
  const el = strip && strip.querySelector(`[data-hour="${hour}"]`);
  if (el) strip.scrollLeft = Math.max(0, el.offsetLeft - strip.offsetLeft - 70);
}

function drawHourly(hours, nowHour, key) {
  const grid = cssVar('--line');
  const warm = cssVar('--warm'), rain = cssVar('--rain'), appC = cssVar('--app');
  const plugins = [];
  if (nowHour != null) plugins.push({
    id: 'nowLine',
    afterDraw(chart) {
      const idx = hours.findIndex(h => h.hour === nowHour);
      if (idx < 0) return;
      const x = chart.scales.x.getPixelForValue(idx);
      const { top, bottom } = chart.chartArea;
      const ctx = chart.ctx;
      ctx.save();
      ctx.strokeStyle = cssVar('--accent');
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
      ctx.fillStyle = cssVar('--accent');
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('現在', x + 4, top + 12);
      ctx.restore();
    }
  });

  const maxPH = Math.max(2, ...hours.map(h => h.precip));
  // 3時間おきに気温の数値をグラフ上に表示
  const tempLabels = {
    id: 'tempLabels',
    afterDatasetsDraw(chart) {
      const meta = chart.getDatasetMeta(0);
      const ctx = chart.ctx;
      ctx.save();
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = warm;
      meta.data.forEach((pt, i) => {
        if (hours[i].hour % 3 !== 0) return;
        const above = hours[i].temp >= hours[i].app;
        ctx.fillText(r0(hours[i].temp) + '°', pt.x, pt.y + (above ? -8 : 16));
      });
      ctx.restore();
    }
  };
  // 目盛りが細かすぎると小さな差が大きく見えるので、最低でも8℃幅で表示
  const allT = hours.flatMap(h => [h.temp, h.app]);
  // 2つのグラフの横の目盛り線を揃えるため、どちらも4分割にする
  const DIV = 4;
  const tLo = Math.min(...allT) - .5, tHi = Math.max(...allT) + .5;
  const tStep = [2, 3, 4, 5, 6, 8, 10].find(st => Math.floor(tLo / st) * st + st * DIV >= tHi) || 10;
  const tMin = Math.floor(tLo / tStep) * tStep;
  const pStep = [.5, 1, 2, 2.5, 5, 10, 20, 25, 50].find(st => st * DIV >= maxPH) || 50;
  // 2つのグラフで横軸を揃える：目盛りは3時間おき、左右の軸幅も固定
  const every3h = i => hours[i] && hours[i].hour % 3 === 0;
  const xOpts = {
    offset: true, // 棒グラフと折れ線で時刻の位置を一致させる
    grid: { offset: false, color: c => every3h(c.index) ? grid : 'transparent' }, // 棒グラフでも線を時刻の真上に
    ticks: { maxRotation: 0, autoSkip: false, callback: (v, i) => every3h(i) ? hours[i].hour + '時' : '' }
  };
  const AXIS_W = 46;
  const fixW = scale => { scale.width = AXIS_W; };
  return [new Chart(document.getElementById(key + 'Temp'), {
    type: 'line',
    data: {
      labels: hours.map(h => h.hour + '時'),
      datasets: [
        { label: '気温', data: hours.map(h => h.temp), borderColor: warm, backgroundColor: warm, borderWidth: 3.5, tension: .35, pointRadius: 0, pointHoverRadius: 5 },
        { label: '体感温度', data: hours.map(h => h.app), borderColor: appC, backgroundColor: appC + '22', borderWidth: 2.5, borderDash: [6, 4], tension: .35, pointRadius: 0, pointHoverRadius: 5, fill: '-1' }
      ]
    },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      layout: { padding: { top: 14, right: AXIS_W } },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => ` ${c.dataset.label}: ${r1(c.parsed.y)}℃`,
            footer: items => {
              const d = r1(hours[items[0].dataIndex].app - hours[items[0].dataIndex].temp);
              return Math.abs(d) < 0.5 ? '体感は気温とほぼ同じ' : `体感は気温より ${Math.abs(d)}℃ ${d < 0 ? '低い' : '高い'}`;
            }
          }
        }
      },
      scales: {
        x: xOpts,
        y: { min: tMin, max: tMin + tStep * DIV, grid: { color: grid }, afterFit: fixW, ticks: { stepSize: tStep, callback: v => v + '°' } }
      }
    },
    plugins: [...plugins, tempLabels]
  }), new Chart(document.getElementById(key + 'Rain'), {
    data: {
      labels: hours.map(h => h.hour + '時'),
      datasets: [
        { type: 'bar', label: '降水量', data: hours.map(h => h.precip), backgroundColor: rain + 'aa', borderRadius: 3, yAxisID: 'y' },
        { type: 'line', label: '降水確率', data: hours.map(h => h.prob), borderColor: rain, borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, stepped: 'middle', yAxisID: 'y1' }
      ]
    },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      layout: { padding: { top: 14 } },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.dataset.type === 'bar' ? r1(c.parsed.y) + 'mm' : c.parsed.y + '%'}` } }
      },
      scales: {
        x: xOpts,
        y: { min: 0, max: pStep * DIV, grid: { color: grid }, afterFit: fixW, ticks: { stepSize: pStep, callback: v => v + 'mm' } },
        y1: { position: 'right', min: 0, max: 100, grid: { display: false }, afterFit: fixW, ticks: { stepSize: 100 / DIV, callback: v => v + '%' } }
      }
    },
    plugins
  })];
}

/* ---------- 日別の詳細モーダル ---------- */
let lastData = null, weekDays = [], modalCharts = [], modalDate = null;
let initialDayHandled = false, modalPushed = false;
const dayModal = () => document.getElementById('dayModal');
const mdLabel = d => `${+d.slice(5, 7)}/${+d.slice(8)}（${DOW[new Date(d + 'T12:00:00Z').getUTCDay()]}）`;

function setUrlDay(date, mode) {
  const u = new URL(location.href);
  if (date) u.searchParams.set('day', date); else u.searchParams.delete('day');
  try {
    if (mode === 'push') { history.pushState({ day: date }, '', u); modalPushed = true; }
    else history.replaceState(modalPushed ? { day: date } : null, '', u);
  } catch (e) {}
}

// mode: 'push'（カードから開く）/ 'replace'（URL から開く・前後の日へ移動）/ 'keep'（データ更新で描き直す）
function openDay(date, mode = 'push') {
  const idx = weekDays.findIndex(d => d.date === date);
  if (idx < 1 || !lastData) { if (mode === 'keep') closeDay(); return; } // 日付が変わって「今日」になった場合など
  const d = weekDays[idx];
  const hours = hoursOf(lastData.hourly, date);
  const f = feel(d.max, d.min);
  const u = umbrella(hours);
  modalDate = date;

  document.getElementById('dmTitle').textContent = `${idx === 1 ? '明日 ' : ''}${mdLabel(date)}の天気`;
  document.getElementById('dmSub').innerHTML =
    `${wDesc(d.code)}・最高 <span class="hi">${r0(d.max)}℃</span> / 最低 <span class="lo">${r0(d.min)}℃</span>`;
  document.getElementById('dmPrev').disabled = idx <= 1;
  document.getElementById('dmNext').disabled = idx >= weekDays.length - 1;
  const body = document.getElementById('dmBody');
  const scrollTop = mode === 'keep' ? body.scrollTop : 0;
  body.innerHTML = `
    <div class="dm-summary">
      ${icon(d.code)}
      <div><div class="t">${f.emoji} ${f.t}・${u.emoji} ${u.t}</div><div class="d">${f.d}${u.need ? ' ' + u.d : ''}</div></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">降水確率（最大）</div><div class="v">${d.prob ?? '-'}%</div></div>
      <div class="stat"><div class="k">降水量（1日）</div><div class="v">${r1(d.precip)} mm</div></div>
      <div class="stat"><div class="k">UV指数</div><div class="v">${r1(d.uv)}</div></div>
      <div class="stat"><div class="k">最大風速</div><div class="v">${r1(d.wind / 3.6)} m/s</div></div>
      <div class="stat"><div class="k">日の出 / 日の入</div><div class="v">${d.sunrise.slice(11)} / ${d.sunset.slice(11)}</div></div>
    </div>
    <h2 class="chart-title" style="margin-top:0">1時間ごとの天気</h2>
    ${hourlyHTML(hours, null, 'modal')}`;

  const dlg = dayModal();
  if (!dlg.open) dlg.showModal();
  if (mode === 'push' && !modalPushed) setUrlDay(date, 'push');
  else if (mode !== 'keep') setUrlDay(date, 'replace');

  modalCharts.forEach(c => c.destroy());
  chartSetup();
  modalCharts = drawHourly(hours, null, 'modal');
  scrollStripTo('modal', 6); // 朝6時から見せる
  body.scrollTop = scrollTop;
}

function closeDay() { if (dayModal().open) dayModal().close(); }

function setupModal() {
  const dlg = dayModal();
  const step = n => {
    const i = weekDays.findIndex(d => d.date === modalDate) + n;
    if (i >= 1 && i < weekDays.length) openDay(weekDays[i].date, 'replace');
  };
  document.getElementById('dmPrev').addEventListener('click', () => step(-1));
  document.getElementById('dmNext').addEventListener('click', () => step(1));
  document.getElementById('dmClose').addEventListener('click', closeDay);
  dlg.addEventListener('click', e => { if (e.target === dlg) closeDay(); }); // 背景をタップで閉じる
  dlg.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  // 閉じたら URL を元に戻す（カードから開いたときは履歴を1つ戻す）
  dlg.addEventListener('close', () => {
    modalCharts.forEach(c => c.destroy());
    modalCharts = [];
    modalDate = null;
    if (modalPushed) { modalPushed = false; history.back(); }
    else setUrlDay(null, 'replace');
  });
  // スマホの「戻る」で閉じる
  window.addEventListener('popstate', () => {
    if (dlg.open && !new URLSearchParams(location.search).get('day')) { modalPushed = false; dlg.close(); }
  });
}

function setupDayCards() {
  document.querySelectorAll('.day[data-date]').forEach((el, i) => {
    // 今日はページ上の「今日の1時間ごとの天気」へ移動、それ以外はモーダル
    const go = () => i === 0
      ? document.getElementById('todayHours').closest('.card').scrollIntoView({ behavior: 'smooth', block: 'start' })
      : openDay(el.dataset.date);
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}

/* ---------- 描画 ---------- */
let charts = [];
async function load() {
  const url = 'https://api.open-meteo.com/v1/forecast?' + new URLSearchParams({
    latitude: ward.lat, longitude: ward.lon, timezone: 'Asia/Tokyo', forecast_days: 7, past_days: 1,
    current: 'temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,wind_speed_10m,precipitation,is_day',
    hourly: 'temperature_2m,apparent_temperature,precipitation,precipitation_probability,weather_code,is_day',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,precipitation_sum,precipitation_probability_max,uv_index_max,wind_speed_10m_max,sunrise,sunset'
  });
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function render(data) {
  const app = document.getElementById('app');
  const tStr = todayStr();
  const D = data.daily, H = data.hourly, C = data.current;
  const ti = D.time.indexOf(tStr);
  const yi = ti - 1;
  const day = i => ({
    date: D.time[i], code: D.weather_code[i], max: D.temperature_2m_max[i], min: D.temperature_2m_min[i],
    appMax: D.apparent_temperature_max[i], precip: D.precipitation_sum[i], prob: D.precipitation_probability_max[i],
    uv: D.uv_index_max[i], wind: D.wind_speed_10m_max[i], sunrise: D.sunrise[i], sunset: D.sunset[i]
  });
  const today = day(ti);
  const yest = yi >= 0 ? day(yi) : null;

  const hours = hoursOf(H, tStr);
  const nowHour = +C.time.slice(11, 13);
  const { tips, headline } = buildTips(today, yest, hours, C);

  const week = [];
  for (let i = ti; i < D.time.length && week.length < 7; i++) week.push(day(i));
  lastData = data;
  weekDays = week;

  app.innerHTML = `
    <section class="card">
      <div class="hero">
        <div class="icon">${icon(C.weather_code, !!C.is_day)}</div>
        <div>
          <div class="now-temp">${r1(C.temperature_2m)}<small>℃ 現在</small></div>
          <div class="desc">${wDesc(C.weather_code)}　<span style="color:var(--muted)">体感 ${r1(C.apparent_temperature)}℃</span></div>
          <div class="hilo">今日の最高 <span class="hi">${r0(today.max)}℃</span> / 最低 <span class="lo">${r0(today.min)}℃</span></div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">降水確率</div><div class="v">${today.prob ?? '-'}%</div></div>
        <div class="stat"><div class="k">降水量（1日）</div><div class="v">${r1(today.precip)} mm</div></div>
        <div class="stat"><div class="k">湿度</div><div class="v">${C.relative_humidity_2m}%</div></div>
        <div class="stat"><div class="k">風速</div><div class="v">${r1(C.wind_speed_10m / 3.6)} m/s</div></div>
        <div class="stat"><div class="k">UV指数</div><div class="v">${r1(today.uv)}</div></div>
        <div class="stat"><div class="k">日の出 / 日の入</div><div class="v">${today.sunrise.slice(11)} / ${today.sunset.slice(11)}</div></div>
      </div>
    </section>

    <section class="card">
      <h2>今日のポイント</h2>
      <p class="headline">${headline}</p>
      <div class="summary">
        ${tips.map(t => `<div class="tip ${t.cls}"><div class="emoji">${t.emoji}</div><div><div class="t">${t.t}</div><div class="d">${t.d}</div></div></div>`).join('')}
      </div>
    </section>

    <section class="card">
      <h2>今日の1時間ごとの天気</h2>
      ${hourlyHTML(hours, nowHour, 'today')}
    </section>

    <section class="card">
      <h2>週間天気</h2>
      <p class="days-hint">日付をタップすると、その日の1時間ごとの天気が見られます</p>
      <div class="days">
        ${week.map((d, i) => {
          const w = new Date(d.date + 'T12:00:00Z').getUTCDay();
          const cls = w === 0 ? 'sun' : w === 6 ? 'sat' : '';
          const attrs = `role="button" tabindex="0" data-date="${d.date}" aria-label="${+d.date.slice(5, 7)}月${+d.date.slice(8)}日の1時間ごとの天気を見る"`;
          return `<div class="day ${i === 0 ? 'today' : ''}" ${attrs}>
            <div class="dn ${cls}">${i === 0 ? '今日' : i === 1 ? '明日' : DOW[w]}</div>
            <div class="dd">${+d.date.slice(5, 7)}/${+d.date.slice(8)}（${DOW[w]}）</div>
            ${icon(d.code)}
            <div class="dw">${wDesc(d.code)}</div>
            <div class="hl"><span class="hi">${r0(d.max)}°</span> / <span class="lo">${r0(d.min)}°</span></div>
            <div class="pr">💧${d.prob ?? '-'}% ・ ${r1(d.precip)}mm</div>
            <div class="umb">${(d.prob ?? 0) >= 60 || d.precip >= 2 ? '☂️' : (d.prob ?? 0) >= 30 ? '🌂' : ''}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="chart-box"><canvas id="weekChart"></canvas></div>
    </section>
  `;

  // 現在時刻へスクロール
  scrollStripTo('today', nowHour);
  drawCharts(hours, week, nowHour);
  setupDayCards();
  // 開いているモーダルは最新データで描き直す／URL の ?day= があれば最初に一度だけ開く
  if (dayModal().open) openDay(modalDate, 'keep');
  else if (!initialDayHandled && view === 'weather') {
    initialDayHandled = true;
    const d = new URLSearchParams(location.search).get('day');
    if (weekDays.findIndex(w => w.date === d) > 0) openDay(d, 'replace');
  }
  document.getElementById('updated').textContent =
    `${+tStr.slice(5, 7)}月${+tStr.slice(8)}日（${DOW[new Date(tStr + 'T12:00:00Z').getUTCDay()]}） ${C.time.slice(11)} 時点`;
}

function chartSetup() {
  Chart.defaults.color = cssVar('--muted');
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.scale.border = { display: false };
}

function drawCharts(hours, week, nowHour) {
  charts.forEach(c => c.destroy());
  chartSetup();
  const grid = cssVar('--line');
  const warm = cssVar('--warm'), cool = cssVar('--cool'), rain = cssVar('--rain');
  const maxPW = Math.max(5, ...week.map(d => d.precip));
  charts = drawHourly(hours, nowHour, 'today');

  charts.push(new Chart(document.getElementById('weekChart'), {
    data: {
      labels: week.map((d, i) => i === 0 ? '今日' : `${+d.date.slice(5, 7)}/${+d.date.slice(8)}`),
      datasets: [
        { type: 'line', label: '最高 (℃)', data: week.map(d => d.max), borderColor: warm, backgroundColor: warm, tension: .3, pointRadius: 4, yAxisID: 'y' },
        { type: 'line', label: '最低 (℃)', data: week.map(d => d.min), borderColor: cool, backgroundColor: cool, tension: .3, pointRadius: 4, yAxisID: 'y' },
        { type: 'bar', label: '降水量 (mm)', data: week.map(d => d.precip), backgroundColor: rain + 'aa', borderRadius: 4, yAxisID: 'y1' }
      ]
    },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { boxWidth: 12, usePointStyle: true } } },
      scales: {
        x: { grid: { color: grid } },
        y: { position: 'left', grid: { color: grid }, ticks: { callback: v => v + '°' }, grace: 2 },
        y1: { position: 'right', min: 0, suggestedMax: maxPW, grid: { display: false }, ticks: { callback: v => v + 'mm' } }
      }
    }
  }));
}


/* ---------- 波予報（なみよみを統合） ---------- */
const Surf = (() => {
  // facing = ビーチから沖を見た方角（度）。これを基準にオフショア/オンショアを判定する
  const SPOTS = [
    { id: 'chigasaki', name: '茅ヶ崎', area: '神奈川', lat: 35.31, lon: 139.40, facing: 185 },
    { id: 'kugenuma', name: '鵠沼', area: '神奈川', lat: 35.31, lon: 139.475, facing: 180 },
    { id: 'onjuku', name: '御宿', area: '千葉', lat: 35.18, lon: 140.36, facing: 135 },
  ];
  const DIRS = ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東', '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'];
  const LS_LAST = 'namiyomi.last'; // 旧なみよみと同じキー（同じドメインなので前回のポイントを引き継ぐ）
  const STALE_MS = 10 * 60 * 1000;
  const $id = id => document.getElementById(id);

  const dirName = deg => deg == null ? '-' : DIRS[Math.round(deg / 22.5) % 16];
  const angDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
  const n1 = v => v == null ? '-' : v.toFixed(1);
  const fmtTime = d => `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  const fmtDay = d => `${d.getMonth() + 1}/${d.getDate()}`;

  function sizeLabel(h) {
    if (h == null) return '-';
    if (h < 0.2) return 'フラット';
    if (h < 0.4) return 'ひざ';
    if (h < 0.6) return 'もも';
    if (h < 0.8) return 'こし';
    if (h < 1.0) return 'はら';
    if (h < 1.3) return 'むね';
    if (h < 1.6) return 'かた';
    if (h < 2.0) return 'あたま';
    if (h < 3.0) return '頭オーバー';
    return 'ダブル';
  }

  // 風向（吹いてくる方角）とビーチの向きの関係
  function windType(windFrom, facing) {
    if (windFrom == null) return null;
    const d = angDiff(windFrom, facing);
    if (d >= 120) return 'off';
    if (d <= 60) return 'on';
    return 'cross';
  }
  const WIND_JA = { off: 'オフショア', on: 'オンショア', cross: 'サイド' };

  function rate(h, period, wSpeed, wType) {
    if (h == null) return null;
    let s;
    if (h < 0.25) s = 0;
    else if (h < 0.4) s = 1;
    else if (h < 0.6) s = 2;
    else if (h < 0.8) s = 3;
    else if (h < 1.6) s = 4.2;
    else if (h < 2.5) s = 4.6;
    else if (h < 3.5) s = 3.5;
    else s = 2;
    if (period != null) {
      if (period < 6) s -= 1;
      else if (period >= 11) s += 0.8;
      else if (period >= 8) s += 0.4;
    }
    if (wSpeed != null && wType) {
      if (wType === 'off') s += wSpeed < 8 ? 0.4 : -0.5;
      else if (wType === 'cross') s -= wSpeed < 3 ? 0 : wSpeed < 6 ? 0.6 : 1.5;
      else s -= wSpeed < 2 ? 0 : wSpeed < 4 ? 1 : wSpeed < 7 ? 2 : 3;
    }
    return Math.max(0, Math.min(5, Math.round(s * 10) / 10));
  }
  const RATE_LABELS = ['ダメ', 'イマイチ', 'まずまず', '良い', 'かなり良い', '最高'];
  const rateLabel = s => s == null ? '-' : RATE_LABELS[Math.min(5, Math.floor(s))];
  const rateColor = s => cssVar('--r' + (s == null ? 0 : Math.min(5, Math.floor(s))));

  function arrowSvg(toDeg, color, size = 22) {
    // toDeg: 矢印が指す方角（北=上）
    return `<svg class="s-arrow" width="${size}" height="${size}" viewBox="-12 -12 24 24" style="transform:rotate(${toDeg}deg)">
      <path d="M0 -10 L6 6 L0 2 L-6 6 Z" fill="${color}"/></svg>`;
  }

  function wetsuit(t) {
    if (t == null) return '';
    if (t >= 25) return 'トランクス / タッパー';
    if (t >= 22) return 'スプリング';
    if (t >= 19) return '3mm フルスーツ';
    if (t >= 15) return '5/3mm フルスーツ';
    return 'セミドライ';
  }

  async function fetchForecast(spot) {
    const q = `latitude=${spot.lat}&longitude=${spot.lon}&timezone=auto&forecast_days=7`;
    const marineUrl = `https://marine-api.open-meteo.com/v1/marine?${q}&cell_selection=sea&hourly=wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_direction,swell_wave_period,wind_wave_height,sea_surface_temperature,sea_level_height_msl`;
    const wxUrl = `https://api.open-meteo.com/v1/forecast?${q}&wind_speed_unit=ms&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m,weather_code&daily=sunrise,sunset`;
    const [m, w] = await Promise.all([marineUrl, wxUrl].map(u => fetch(u).then(r => {
      if (!r.ok) throw new Error(`API ${r.status}`);
      return r.json();
    })));

    const wIdx = new Map(w.hourly.time.map((t, i) => [t, i]));
    const hours = m.hourly.time.map((t, i) => {
      const j = wIdx.get(t);
      const g = k => j == null ? null : w.hourly[k][j];
      const h = {
        time: t, date: new Date(t),
        wave: m.hourly.wave_height[i], waveDir: m.hourly.wave_direction[i], wavePeriod: m.hourly.wave_period[i],
        swell: m.hourly.swell_wave_height[i], swellDir: m.hourly.swell_wave_direction[i], swellPeriod: m.hourly.swell_wave_period[i],
        windWave: m.hourly.wind_wave_height[i], sst: m.hourly.sea_surface_temperature[i], tide: m.hourly.sea_level_height_msl[i],
        wind: g('wind_speed_10m'), windDir: g('wind_direction_10m'), gust: g('wind_gusts_10m'),
        temp: g('temperature_2m'), code: g('weather_code'),
      };
      h.windType = windType(h.windDir, spot.facing);
      h.period = h.swellPeriod ?? h.wavePeriod;
      h.score = rate(h.wave, h.period, h.wind, h.windType);
      return h;
    });
    const sun = {};
    w.daily.time.forEach((d, i) => { sun[d] = { rise: new Date(w.daily.sunrise[i]), set: new Date(w.daily.sunset[i]) }; });
    return { hours, sun, utcOffset: m.utc_offset_seconds };
  }

  function tideExtremes(hours) {
    const ex = [];
    for (let i = 1; i < hours.length - 1; i++) {
      const a = hours[i - 1].tide, b = hours[i].tide, c = hours[i + 1].tide;
      if (a == null || b == null || c == null) continue;
      if (b > a && b >= c) ex.push({ i, type: 'high', h: hours[i] });
      else if (b < a && b <= c) ex.push({ i, type: 'low', h: hours[i] });
    }
    return ex;
  }

  // スポットの現地時刻の "YYYY-MM-DDTHH:00" を作る（APIの時刻表記と合わせる）
  const localHourKey = utcOffset => new Date(Date.now() + utcOffset * 1000).toISOString().slice(0, 13) + ':00';

  let spot = null, current = null, loadedAt = 0, reqId = 0, tides = [];
  let moveCursor = () => {};
  const COL = 9, PAD_L = 34;

  function renderTabs() {
    $id('spotTabs').innerHTML = SPOTS.map(s =>
      `<button role="tab" data-id="${s.id}" aria-selected="${s === spot}"><small>${s.area}</small>${s.name}</button>`).join('');
  }

  async function load(force) {
    const id = ++reqId;
    try { localStorage.setItem(LS_LAST, JSON.stringify(spot.id)); } catch (e) {}
    if (!current || current.spot !== spot) $id('surf').innerHTML = `<div class="card loading">${spot.name}の波予報を読み込み中…</div>`;
    try {
      const data = await fetchForecast(spot);
      if (id !== reqId) return;
      current = { spot, ...data };
      loadedAt = Date.now();
      render();
    } catch (e) {
      console.error(e);
      if (id === reqId && !(current && current.spot === spot))
        $id('surf').innerHTML = `<div class="card error">波予報を取得できませんでした（${e.message}）。時間をおいて再読み込みしてください。</div>`;
    }
  }

  function render() {
    const { hours, sun, utcOffset } = current;
    let nowIdx = hours.findIndex(h => h.time === localHourKey(utcOffset));
    if (nowIdx < 0) nowIdx = 0;
    tides = tideExtremes(hours);

    $id('surf').innerHTML = `
      <section class="s-hero">
        <div class="card s-score" id="sScore"></div>
        <div class="card s-stats" id="sStats"></div>
      </section>
      <section class="card">
        <h2>週間予報<small>日中のベストタイム・タップでその時間を表示</small></h2>
        <div class="s-days" id="sDays"></div>
      </section>
      <section class="card">
        <h2>時間別</h2>
        <div class="s-chart-head">
          <div class="s-readout" id="sReadout"></div>
          <div class="s-legend">
            <span><i style="background:${cssVar('--r1')}"></i>イマイチ</span>
            <span><i style="background:${cssVar('--r3')}"></i>良い</span>
            <span><i style="background:${cssVar('--r5')}"></i>最高</span>
            <span><i style="background:${cssVar('--sand')}"></i>潮位</span>
          </div>
        </div>
        <div class="s-scroller" id="sScroller"><svg id="sChart" role="img" aria-label="時間別の波高・潮位・風"></svg></div>
      </section>`;
    showHour(nowIdx);
    renderDays(hours, sun);
    renderChart(hours, sun, nowIdx);
  }

  function stat(k, v, s) { return `<div class="s-stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`; }

  function showHour(i) {
    const { hours } = current;
    const h = hours[i];
    const isNow = h.time === localHourKey(current.utcOffset);
    const color = rateColor(h.score);
    const sc = $id('sScore');
    sc.style.background = `linear-gradient(160deg, ${color}, ${cssVar('--r5')})`;
    sc.innerHTML = `
      <div>
        <div class="when">${isNow ? 'いま ' : ''}${fmtDay(h.date)}(${DOW[h.date.getDay()]}) ${h.date.getHours()}時</div>
        <div class="spot">${spot.name}</div>
      </div>
      <div>
        <div class="big">${h.score == null ? '-' : h.score.toFixed(1)}<small>/ 5</small></div>
        <div class="label">${rateLabel(h.score)}</div>
        <div class="size">サイズ: ${sizeLabel(h.wave)}（${n1(h.wave)}m）</div>
      </div>
      <svg class="wave-deco" viewBox="0 0 300 60" preserveAspectRatio="none"><path d="M0 30 Q 37.5 10 75 30 T 150 30 T 225 30 T 300 30 V60 H0Z" fill="#fff"/></svg>`;

    const next = tides.filter(t => t.i > i).slice(0, 2);
    const wt = h.windType;
    $id('sStats').innerHTML = `
      ${stat('波高', `${n1(h.wave)}<small>m</small>`, `うねり ${n1(h.swell)}m / 風波 ${n1(h.windWave)}m`)}
      ${stat('周期', `${n1(h.period)}<small>秒</small>`, h.period == null ? '' : h.period >= 10 ? 'パワーのあるうねり' : h.period >= 7 ? '標準的' : '短くまとまりにくい')}
      ${stat('うねりの向き', `${arrowSvg((h.swellDir ?? 0) + 180, cssVar('--accent'))}${dirName(h.swellDir)}`, h.swellDir == null ? '' : `${Math.round(h.swellDir)}° から`)}
      ${stat('風', `${arrowSvg((h.windDir ?? 0) + 180, wt ? cssVar('--' + wt) : cssVar('--muted'))}${n1(h.wind)}<small>m/s</small>`,
        `${dirName(h.windDir)}の風 ${wt ? `<span class="s-tag ${wt}">${WIND_JA[wt]}</span>` : ''} 最大 ${n1(h.gust)}m/s`)}
      ${stat('水温 / 気温', `${n1(h.sst)}<small>℃</small>`, `気温 ${n1(h.temp)}℃ ・ ${wetsuit(h.sst)}`)}
      ${stat('潮', `${h.tide == null ? '-' : (h.tide * 100).toFixed(0)}<small>cm</small>`,
        next.map(t => `${t.type === 'high' ? '満潮' : '干潮'} ${t.h.date.getHours()}時`).join(' / ') || '-')}`;

    const r = $id('sReadout');
    if (r) r.textContent = `${fmtDay(h.date)}(${DOW[h.date.getDay()]}) ${h.date.getHours()}時 ｜ ${n1(h.wave)}m ${sizeLabel(h.wave)} ・ ${n1(h.period)}秒 ・ 風 ${n1(h.wind)}m/s ${wt ? WIND_JA[wt] : ''}`;
  }

  function renderDays(hours, sun) {
    const groups = {};
    hours.forEach((h, i) => { (groups[h.time.slice(0, 10)] ||= []).push(i); });
    $id('sDays').innerHTML = Object.entries(groups).map(([key, idxs]) => {
      const s = sun[key];
      const daylight = idxs.filter(i => !s || (hours[i].date >= new Date(s.rise.getTime() - 3600e3) && hours[i].date <= s.set));
      const pool = daylight.length ? daylight : idxs;
      const best = pool.reduce((a, b) => (hours[b].score ?? -1) > (hours[a].score ?? -1) ? b : a);
      const waves = pool.map(i => hours[i].wave).filter(v => v != null);
      const lo = Math.min(...waves), hi = Math.max(...waves);
      const bh = hours[best], d = bh.date;
      const dayTides = tides.filter(t => t.h.time.startsWith(key));
      return `<div class="s-day" role="button" tabindex="0" data-idx="${idxs[0]}" data-best="${best}" aria-label="${fmtDay(d)}のベストタイムを表示">
        <div class="d">${fmtDay(d)}<small>(${DOW[d.getDay()]})</small></div>
        <div class="bar" style="background:${rateColor(bh.score)}"></div>
        <div class="sz">${sizeLabel(hi)}</div>
        <div class="meta">
          ${waves.length ? `${lo.toFixed(1)}–${hi.toFixed(1)}m` : '-'}<br>
          ベスト ${d.getHours()}時 ★${bh.score?.toFixed(1) ?? '-'}<br>
          ${bh.windType ? WIND_JA[bh.windType] : ''} ${n1(bh.wind)}m/s<br>
          ${dayTides.map(t => `${t.type === 'high' ? '満' : '干'}${t.h.date.getHours()}時`).join(' ')}
          ${s ? `<br>☀ ${fmtTime(s.rise)}–${fmtTime(s.set)}` : ''}
        </div>
      </div>`;
    }).join('');

    document.querySelectorAll('.s-day').forEach(el => {
      const go = () => {
        const best = +el.dataset.best;
        document.querySelectorAll('.s-day.sel').forEach(x => x.classList.remove('sel'));
        el.classList.add('sel');
        showHour(best);
        scrollChartTo(+el.dataset.idx);
        moveCursor(best);
        $id('sScore').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      };
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
  }

  function scrollChartTo(idx) {
    $id('sScroller').scrollTo({ left: Math.max(0, idx * COL), behavior: 'smooth' });
  }

  function renderChart(hours, sun, nowIdx) {
    const svg = $id('sChart');
    const W = PAD_L + hours.length * COL + 10;
    const top = 26, waveH = 150, gap = 18, tideH = 50, windY = top + waveH + gap + tideH + 22;
    const H = windY + 22;
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    const maxWave = Math.max(2, Math.ceil(Math.max(...hours.map(h => h.wave ?? 0)) * 2) / 2);
    const y = v => top + waveH - (v / maxWave) * waveH;
    const tVals = hours.map(h => h.tide).filter(v => v != null);
    const tMin = Math.min(...tVals), tMax = Math.max(...tVals);
    const tTop = top + waveH + gap;
    const ty = v => tTop + tideH - ((v - tMin) / ((tMax - tMin) || 1)) * tideH;
    const x = i => PAD_L + i * COL;
    const line = cssVar('--line'), faint = cssVar('--muted');
    let out = '';

    // 夜間の網掛け
    hours.forEach((h, i) => {
      const s = sun[h.time.slice(0, 10)];
      if (s && (h.date < new Date(s.rise.getTime() - 3600e3) || h.date > s.set))
        out += `<rect x="${x(i)}" y="${top}" width="${COL}" height="${tTop + tideH - top}" fill="${faint}" opacity=".1"/>`;
    });
    // グリッド
    for (let v = 0; v <= maxWave; v += 0.5) {
      out += `<line x1="${PAD_L}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="${line}" stroke-dasharray="${v ? '2 3' : ''}"/>`;
      if (v % 1 === 0) out += `<text x="${PAD_L - 6}" y="${y(v) + 3}" text-anchor="end">${v}m</text>`;
    }
    out += `<text x="${PAD_L - 6}" y="${tTop + tideH / 2 + 3}" text-anchor="end">潮</text>`;
    out += `<text x="${PAD_L - 6}" y="${windY + 3}" text-anchor="end">風</text>`;
    // 日付区切り
    hours.forEach((h, i) => {
      if (h.date.getHours() === 0) {
        out += `<line x1="${x(i)}" x2="${x(i)}" y1="4" y2="${H}" stroke="${line}"/>`;
        out += `<text class="daylbl" x="${x(i) + 6}" y="16">${fmtDay(h.date)}(${DOW[h.date.getDay()]})</text>`;
      }
      if (h.date.getHours() % 6 === 0 && h.date.getHours() !== 0)
        out += `<text x="${x(i) + COL / 2}" y="${top + waveH + 12}" text-anchor="middle">${h.date.getHours()}</text>`;
    });
    // 波高バー
    hours.forEach((h, i) => {
      if (h.wave == null) return;
      out += `<rect x="${x(i) + 1}" y="${y(h.wave)}" width="${COL - 2}" height="${Math.max(1, top + waveH - y(h.wave))}" rx="2" fill="${rateColor(h.score)}"/>`;
    });
    // うねり高ライン
    out += `<polyline fill="none" stroke="${cssVar('--text')}" stroke-opacity=".45" stroke-width="1.2" points="${hours.map((h, i) => h.swell == null ? '' : `${x(i) + COL / 2},${y(h.swell)}`).join(' ')}"/>`;
    // 潮位
    const tidePts = hours.map((h, i) => h.tide == null ? null : [x(i) + COL / 2, ty(h.tide)]).filter(Boolean);
    if (tidePts.length) {
      out += `<path d="M${tidePts[0][0]},${tTop + tideH} L${tidePts.map(p => p.join(',')).join(' L')} L${tidePts.at(-1)[0]},${tTop + tideH} Z" fill="${cssVar('--sand')}" opacity=".18"/>`;
      out += `<polyline fill="none" stroke="${cssVar('--sand')}" stroke-width="1.6" points="${tidePts.map(p => p.join(',')).join(' ')}"/>`;
    }
    tides.forEach(t => {
      const cx = x(t.i) + COL / 2, cy = ty(t.h.tide);
      out += `<text x="${cx}" y="${t.type === 'high' ? cy - 5 : cy + 12}" text-anchor="middle" style="fill:${cssVar('--sand')}">${t.h.date.getHours()}</text>`;
    });
    // 風の矢印（3時間ごと）
    hours.forEach((h, i) => {
      if (i % 3 !== 1 || h.windDir == null) return;
      const c = h.windType ? cssVar('--' + h.windType) : faint;
      const sc = 0.55 + Math.min(1, (h.wind ?? 0) / 10) * 0.45;
      out += `<g transform="translate(${x(i) + COL / 2},${windY}) rotate(${h.windDir + 180}) scale(${sc})"><path d="M0 -10 L6 6 L0 2 L-6 6 Z" fill="${c}"/></g>`;
    });
    // 現在時刻とカーソル
    out += `<line x1="${x(nowIdx) + COL / 2}" x2="${x(nowIdx) + COL / 2}" y1="${top - 4}" y2="${H}" stroke="${cssVar('--on')}" stroke-width="1.5"/>`;
    out += `<rect id="sCursor" x="${x(nowIdx)}" y="${top}" width="${COL}" height="${H - top}" fill="${cssVar('--accent')}" opacity=".18" rx="2"/>`;
    svg.innerHTML = out;

    const cursor = svg.querySelector('#sCursor');
    moveCursor = i => cursor.setAttribute('x', x(i));
    const pick = ev => {
      const r = svg.getBoundingClientRect();
      const i = Math.floor((ev.clientX - r.left - PAD_L) / COL);
      if (i < 0 || i >= hours.length) return;
      moveCursor(i);
      showHour(i);
    };
    svg.addEventListener('pointermove', pick);
    svg.addEventListener('pointerdown', pick);
    requestAnimationFrame(() => scrollChartTo(Math.max(0, nowIdx - 6)));
  }

  function init() {
    let last = null;
    try { last = JSON.parse(localStorage.getItem(LS_LAST)); } catch (e) {}
    spot = SPOTS.find(s => s.id === last) || SPOTS[0];
    $id('spotTabs').addEventListener('click', e => {
      const btn = e.target.closest('button[data-id]');
      const s = btn && SPOTS.find(x => x.id === btn.dataset.id);
      if (!s || s === spot) return;
      spot = s;
      renderTabs();
      updateTitle();
      load();
    });
    renderTabs();
  }

  // 表示されたとき：まだ読み込んでいない／古ければ取得
  function show() {
    if (!current || current.spot !== spot || Date.now() - loadedAt > STALE_MS) load();
  }

  return { init, show, spotName: () => spot.name };
})();

/* ---------- 天気｜波 の切り替え ---------- */
let view = 'weather';
let pendingWeather = null; // 波タブ表示中に届いた天気データ（非表示のまま描くとグラフが大きさ0になるため後で描く）
function updateTitle() {
  document.title = view === 'surf' ? `波予報（${Surf.spotName()}）｜東京都の天気` : `東京都の天気（${ward.name}）`;
}
function setView(v, save = true) {
  view = v === 'surf' ? 'surf' : 'weather';
  const surf = view === 'surf';
  document.querySelectorAll('#viewTabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === view)));
  document.getElementById('weatherHead').hidden = surf;
  document.getElementById('app').hidden = surf;
  document.getElementById('surfHead').hidden = !surf;
  document.getElementById('surf').hidden = !surf;
  document.getElementById('surfNote').hidden = !surf;
  updateTitle();
  if (save) {
    try { localStorage.setItem('view', view); } catch (e) {}
    const u = new URL(location.href);
    if (surf) u.searchParams.set('view', 'surf'); else u.searchParams.delete('view');
    try { history.replaceState(history.state, '', u); } catch (e) {}
  }
  if (surf) Surf.show();
  else if (pendingWeather) { render(pendingWeather); pendingWeather = null; }
}
function setupViewTabs() {
  document.getElementById('viewTabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-view]');
    if (b && b.dataset.view !== view) { closeDay(); setView(b.dataset.view); window.scrollTo(0, 0); }
  });
  // URL(?view=surf) → 前回の表示 → 天気 の順で決める
  let saved = null;
  try { saved = localStorage.getItem('view'); } catch (e) {}
  const fromUrl = new URLSearchParams(location.search).get('view');
  setView(fromUrl || saved || 'weather', false);
}

let reqId = 0;
async function refresh() {
  const id = ++reqId; // 区を素早く切り替えたとき、古い応答で上書きしない
  if (view === 'weather') document.title = `東京都の天気（${ward.name}）`;
  try {
    const data = await load();
    if (id !== reqId) return;
    if (view === 'weather') render(data); else pendingWeather = data;
  } catch (e) {
    console.error(e);
    if (id === reqId && !document.querySelector('.hero'))
      document.getElementById('app').innerHTML = `<div class="card error">天気データを取得できませんでした（${e.message}）。時間をおいて再読み込みしてください。</div>`;
  }
}
setupWardSelect();
setupModal();
Surf.init();
setupViewTabs();
refresh();
setInterval(() => { refresh(); if (view === 'surf') Surf.show(); }, 10 * 60 * 1000);
</script>
